name: Lab

on:
  push:
    branches: [m2/lab]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: lab/providers/qemu-ci/preflight.sh
      - run: |
          lab/providers/qemu-ci/fetch-iso.sh ws2016 "$LAB_WORK/iso" &
          lab/providers/qemu-ci/fetch-iso.sh ws2022 "$LAB_WORK/iso" &
          wait -n; wait -n
      - if: always()
        run: |
          for iso in "$LAB_WORK"/iso/*.iso; do
            sudo mkdir -p /media/iso && sudo mount -o loop,ro "$iso" /media/iso
            wiminfo /media/iso/sources/install.wim | grep -E '^(Index|Name|Edition ID|Installation Type)'
            sudo umount /media/iso
          done
          df -h / /mnt
