name: CI

# Public repository: GitHub-hosted runners cost nothing, so every pull request
# runs everything, Windows included. Hence:
# - pushes to dev and main run the same jobs and save the caches that pull
#   requests restore (pull requests only read them, so the cache stays small);
# - the merge queue (merge_group) runs them again on the merged result;
# - a weekly run on main also catches new RustSec advisories and runs the
#   benches;
# - documentation-only changes run the light checks only (job `changes`),
#   so that the required check `ci-ok` still reports on them;
# - GitHub-hosted runners only: a self-hosted runner would execute the code of
#   pull requests from forks.
#
# Branch protection of dev and main requires the single check `ci-ok`, which
# succeeds only when every job succeeded or was skipped as documentation-only.
on:
  pull_request:
  push:
    branches: [main, dev]
  merge_group:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its previous run; runs on dev and main
# go to the end, so that each one saves its caches.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

# Third-party actions are pinned by commit SHA; the tag is in the comment.
jobs:
  # Whether the change touches more than documentation: docs/**, *.md and
  # LICENSE only skip the build jobs. Scheduled and manual runs, and pushes
  # without a known previous commit, run everything.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            merge_group) base="$MQ_BASE"; head="$MQ_HEAD" ;;
            push) base="$PUSH_BEFORE"; head="$PUSH_AFTER" ;;
            *) base=""; head="" ;;
          esac
          code=true
          if [ -n "$base" ] && [ -n "$head" ] && ! [[ "$base" =~ ^0+$ ]] \
             && files="$(git diff --name-only "$base" "$head")"; then
            code=false
            while IFS= read -r f; do
              case "$f" in
                docs/*|*.md|LICENSE) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

  # Light checks gathered in one job: one checkout and one toolchain for all.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny,cargo-cyclonedx
      - run: cargo fmt --all --check
      - run: cargo xtask check-secrets
      - run: cargo deny --locked check
      - run: cargo deny --manifest-path fuzz/Cargo.toml --locked check
      - run: cargo xtask sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: target/sbom/
          retention-days: 30
      - name: Every commit carries a Signed-off-by matching its author
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format='%B' "$c" | grep -Fqx "Signed-off-by: $author"; then
              echo "::error::commit $c has no 'Signed-off-by: $author'"
              status=1
            fi
          done
          exit $status

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # ostena-frame is also the protocol core of the browser client.
      - run: cargo build --locked --release -p ostena-frame --target wasm32-unknown-unknown
      # Displayed only: no regression gate yet (ADR-0005). On dev and main.
      # The SSH latency benches run in their own job (bench-ssh).
      - if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: |
          cargo bench --locked -p ostena-scope
          cargo bench --locked -p ostena-frame

  # SSH interoperability (ADR-0010): the OpenSSH client of the runner against
  # our server behind the pre-check (sessions, refusals, audit) and, with a
  # certificate, through the agent server to a target; the SSH access through
  # the gateway against the test core; our client against a Debian 12
  # OpenSSH server in Docker, with the agent key installed as
  # `restrict,from=`; then the native access end to end to that target,
  # through the real agent binary (test agent_ssh of ostena-cli).
  # Needs Docker.
  ssh-interop:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: ssh -V
      # The transfer tests run the real sftp-server and rsync on the target
      # side (OSTENA_REQUIRE_OPENSSH makes them mandatory).
      - run: sudo apt-get install -y --no-install-recommends openssh-sftp-server rsync
      - run: cargo test --locked -p ostena-ssh --test interop --test gateway --test transfers --test algorithms
        env:
          OSTENA_REQUIRE_OPENSSH: "1"
      - run: bash tests/ssh/debian12-target.sh
      - run: bash tests/ssh/native-e2e.sh

  # The core against PostgreSQL 16 as in production (ADR-0011): Unix socket,
  # `peer` authentication, a role named after the runner account, allowed to
  # create the roles of the core (ostena_owner, ostena_app). Tests that
  # need a database are mandatory here (OSTENA_REQUIRE_DB). Then the offline
  # query cache (crates/ostena-core/.sqlx) is checked against the migrations.
  # Uses the PostgreSQL preinstalled on the runner (sudo).
  core-db:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OSTENA_TEST_DB_SOCKET: /var/run/postgresql
      OSTENA_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: sqlx-cli@0.9.0
      - name: PostgreSQL 16, local connections by peer only
        run: |
          sudo systemctl start postgresql.service
          psql --version | grep -q ' 16\.'
          # One test account, which plays every login role: the tests of
          # the binary run in development mode, which tolerates it, and
          # check that production refuses it (CORE-E014, ADR-0011).
          sudo -u postgres createuser --createdb --createrole "$USER"
          echo "OSTENA_TEST_DB_USER=$USER" >> "$GITHUB_ENV"
      - run: cargo test --locked -p ostena-core -p ostena-cli
      - name: Production, two system accounts (service and migrations)
        run: |
          # As in production (ADR-0011): roles and database under the
          # PostgreSQL superuser, the schema under the migration account,
          # the service under its own account, which cannot migrate.
          for account in ostena_ci ostena_ci_admin; do
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin "$account"
          done
          # Owned by root, as in production (CFG-P006).
          dir="$(sudo mktemp -d)"
          sudo chmod 711 "$dir"
          sudo install -m 0755 target/debug/ostena "$dir/ostena"
          sudo tee "$dir/core.toml" > /dev/null <<EOF
          mode = "production"

          [core]
          tunnel_listen = "127.0.0.1:7001"
          enrollment_listen = "127.0.0.1:7002"
          tls_root_ca = "$dir/root.pem"
          tls_certificate = "$dir/server.pem"
          tls_private_key = { credential = "server.key" }
          issuing_certificate = "$dir/issuing.pem"
          issuing_private_key = { credential = "issuing.key" }
          grant_signing_key = { credential = "grant.key" }

          [core.audit]
          signing_key = { credential = "audit.key" }

          [core.database]
          name = "ostena_ci_roles"
          user = "ostena_ci"
          migration_user = "ostena_ci_admin"
          EOF
          sudo chmod 0644 "$dir/core.toml"
          run() {
            local account="$1"; shift
            sudo -u "$account" -- "$dir/ostena" core "$@" --config "$dir/core.toml"
          }
          run postgres db init --superuser postgres
          run ostena_ci_admin migrate
          run ostena_ci_admin migrate --check
          # The roles pass the production checks (no CORE-E014).
          run ostena_ci user list
          if run ostena_ci migrate; then
            echo "the service account migrated" >&2
            exit 1
          fi
      - name: The offline query cache matches the migrations
        working-directory: crates/ostena-core
        run: |
          # Migration 6 grants to ostena_app (ADR-0011): the role must exist
          # (the tests above created it; created here if they did not run).
          psql -h /var/run/postgresql -d postgres -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'ostena_app') THEN
              CREATE ROLE ostena_app NOLOGIN; END IF; END \$\$"
          createdb -h /var/run/postgresql ostena_prepare
          # sqlx wants a user and a host name; `host=` then selects the socket.
          export DATABASE_URL="postgres://$USER@localhost/ostena_prepare?host=/var/run/postgresql"
          cargo sqlx migrate run
          cargo sqlx prepare --check -- --all-targets

  # Static release binary, then the agent service lifecycle under systemd
  # (install, status, permissions, hardening score, clean stop, bounded
  # restarts, uninstall), the unit on systemd 252 (Debian 12), and the idle
  # footprint. Needs a full VM with systemd.
  release-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # aws-lc-sys compiles C for the musl target with musl-gcc.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo build --release --locked --package ostena-cli --target x86_64-unknown-linux-musl
      - name: Check the binary is statically linked
        run: |
          bin=target/x86_64-unknown-linux-musl/release/ostena
          file "$bin"
          file "$bin" | grep -Eq 'static(-pie)? linked|statically linked'
          "$bin" --version
      # The release binary must not contain the test core (feature `testing`).
      - run: cargo xtask check-release target/x86_64-unknown-linux-musl/release/ostena
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ostena-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/ostena
          retention-days: 7
      - run: cargo build --release --locked --package ostena-cli
      - run: bash tests/agent/linux-service.sh target/release/ostena
      # The static musl binary is the Linux release artifact: measure it.
      - run: cargo xtask footprint --target x86_64-unknown-linux-musl
      # The test core built by footprint, for the package installation tests.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-core-linux
          path: target/release/examples/test_core
          retention-days: 7

  # All targets in one job, 30 s each: the fuzz build is shared. Longer runs:
  # fuzz-nightly.yml.
  fuzz-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # The dated nightly pinned in fuzz/rust-toolchain.toml.
      - run: rustup toolchain install
        working-directory: fuzz
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: fuzz
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: |
            . -> target
            fuzz -> target
      # No target given: every target of FUZZ_TARGETS.
      - run: cargo xtask fuzz 30
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 30

  # Clippy, tests, the release binary and the agent service lifecycle under
  # the SCM (account, restricted SID, required privileges, bounded failure
  # actions, ACLs, status, non-administrator refused on the control pipe,
  # clean stop, uninstall) in one job, so the release build is shared.
  # Windows 2022 runs the service part only.
  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - if: matrix.os == 'windows-2025'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: matrix.os == 'windows-2025'
        run: cargo test --workspace --locked
      # The host target is x86_64-pc-windows-msvc: same binary as with an
      # explicit --target, in target/release, shared with xtask footprint.
      - run: cargo build --release --locked --package ostena-cli
      - run: target/release/ostena.exe --version
      - run: cargo xtask check-release target/release/ostena.exe
      # Authenticode with a test certificate drawn for this job (ADR-0024),
      # before the MSI embeds the executable.
      - if: matrix.os == 'windows-2025'
        run: packaging/windows/sign-test.ps1 -Name exe -Files target/release/ostena.exe -Certificate target/release/ostena-exe-test.cer
        shell: pwsh
      - if: matrix.os == 'windows-2025'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ostena-x86_64-pc-windows-msvc
          path: |
            target/release/ostena.exe
            target/release/ostena-exe-test.cer
          retention-days: 7
      - run: tests/agent/windows-service.ps1 -Binary target/release/ostena.exe
        shell: pwsh
      - run: cargo xtask footprint
      # The test core built by footprint, for the MSI installation tests.
      - if: matrix.os == 'windows-2025'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-core-windows
          path: target/release/examples/test_core.exe
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-log-${{ matrix.os }}
          path: C:\ProgramData\Ostena\state\agent.log
          if-no-files-found: ignore
          retention-days: 14

  # The RDP driver against a real Windows target (ADR-0019): RDP enabled on
  # the loopback of the runner (NLA, Restricted Admin allowed, a local
  # administrator with a random password, the same for every mode).
  # Production mode: Restricted Admin with NTLM; development mode: the
  # password delegated; the refusals of REG-SEC-01 and REG-SEC-02; the
  # sessions logged off at their end and before a new one on the same
  # account (ADR-0026). One session at a time; the measured phases go to
  # the summary of the job.
  rdp-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: tests/rdp/windows-target.ps1
        shell: pwsh
      - run: |
          $env:OSTENA_RDP_TARGET_SUMMARY = $env:GITHUB_STEP_SUMMARY
          cargo test --locked -p ostena-rdp --test windows_target -- --nocapture --test-threads=1
        shell: pwsh
        env:
          OSTENA_REQUIRE_RDP_TARGET: "1"
      # What the target logged about its sessions and the logons of the
      # test account: why a session ended.
      - if: failure()
        run: tests/rdp/windows-target-events.ps1
        shell: pwsh

  # Agent packages (ADR-0024), built offline on Linux: the .deb with dpkg-deb
  # from the static musl binary (built twice: it must be reproducible), the
  # MSI with wixl (msitools) around the signed ostena.exe. The MSI is signed
  # by msi-sign.
  package:
    needs: [changes, release-linux, windows]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends wixl msitools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ostena-x86_64-unknown-linux-musl
          path: bin/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ostena-x86_64-pc-windows-msvc
          path: bin/windows
      - name: .deb, built twice and compared
        run: |
          chmod +x bin/linux/ostena
          deb=$(packaging/debian/build-deb.sh bin/linux/ostena out/deb)
          again=$(packaging/debian/build-deb.sh bin/linux/ostena out/deb-again)
          cmp "$deb" "$again"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
      - run: packaging/windows/build-msi.sh bin/windows/ostena.exe out/msi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ostena-deb
          path: out/deb/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ostena-msi-unsigned
          path: out/msi/
          retention-days: 1

  # Authenticode signature of the MSI with a test certificate drawn for this
  # job (ADR-0024); signtool is part of the Windows SDK of the runner.
  msi-sign:
    needs: [changes, package]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ostena-msi-unsigned
          path: msi
      - run: packaging/windows/sign-test.ps1 -Name msi -Files (Get-ChildItem msi\*.msi).FullName -Certificate msi\ostena-msi-test.cer
        shell: pwsh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ostena-msi
          path: msi/
          retention-days: 7

  # The MSI installed silently on each Windows Server runner, connected to a
  # test core (the identity it issues stands for an enrolment): signatures,
  # service, status, no listening port (dial-back), control pipe refused to
  # a non-administrator, repair, removal (tests/packaging/windows-msi.ps1).
  install-windows:
    needs: [changes, msi-sign, windows]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ostena-msi
          path: msi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ostena-x86_64-pc-windows-msvc
          path: exe
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-core-windows
          path: core
      - name: Silent installation against a test core
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'core'
          New-Item -ItemType Directory -Force $dir | Out-Null
          # The test core serves until its standard input is closed.
          $info = [Diagnostics.ProcessStartInfo]::new((Resolve-Path core\test_core.exe).Path)
          $info.ArgumentList.Add($dir)
          $info.ArgumentList.Add('2f6c9a4e-1b2c-4d5e-8f90-a1b2c3d4e5f6')
          $info.RedirectStandardInput = $true
          $info.RedirectStandardOutput = $true
          $info.UseShellExecute = $false
          $core = [Diagnostics.Process]::Start($info)
          $line = $core.StandardOutput.ReadLine()
          if ($line -notmatch '^core (.+)$') { Write-Host "::error::test core: $line"; exit 1 }
          $address = $Matches[1]
          Write-Host "test core at $address"
          try {
            tests/packaging/windows-msi.ps1 -Msi (Get-ChildItem msi\*.msi).FullName `
              -CoreAddress $address -RootCa (Join-Path $dir 'root.pem') -IdentityDir $dir `
              -ExpectConnected -TrustCertificate exe\ostena-exe-test.cer, msi\ostena-msi-test.cer
            $code = $LASTEXITCODE
          } finally {
            $core.StandardInput.Close()
            $core.WaitForExit(10000) | Out-Null
          }
          exit $code
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-logs-${{ matrix.os }}
          path: |
            C:\ProgramData\Ostena\setup.log
            C:\ProgramData\Ostena\state\agent.log
          if-no-files-found: ignore
          retention-days: 14

  # The .deb in Debian 12 and 13 containers whose PID 1 is systemd, connected
  # to a test core on the host: postinst, setup, service, status, no
  # listening port (dial-back), control socket refused to a non-root user,
  # reinstallation, removal, purge (tests/packaging/debian-install.sh).
  install-debian:
    needs: [changes, package, release-linux]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13"]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ostena-deb
          path: deb
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-core-linux
          path: core
      - env:
          IMAGE: ${{ matrix.image }}
        run: |
          chmod +x core/test_core
          bash tests/packaging/debian-install.sh "$IMAGE" deb/*.deb core/test_core

  # SSH latency (CLAUDE.md: at most 3 ms added at p99 by SSH, session set up
  # in less than 5 s): the agent relay and the tunnel, on every run. The
  # summary of the job shows the table; the raw results are an artifact.
  # Displayed only, never a gate (ADR-0005).
  bench-ssh:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo xtask bench-ssh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-ssh-latency
          path: target/bench/
          retention-days: 90

  # Signed deliverables (ADR-0017), with a TEST key drawn for this run only
  # and never kept: the Linux and Windows release binaries, the agent
  # packages (.deb, MSI with the public test certificates of its
  # Authenticode signatures, ADR-0024) and the SBOMs in one manifest, signed and verified by the binary itself, then a modified
  # copy must be refused. The artifact holds the files, the manifest, its
  # signature and the public test key.
  release-sign:
    needs: [changes, checks, release-linux, windows, package, msi-sign]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ostena-x86_64-unknown-linux-musl
          path: signed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ostena-x86_64-pc-windows-msvc
          path: signed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-cyclonedx
          path: signed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ostena-deb
          path: signed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ostena-msi
          path: signed
      - name: Sign with a test key, verify, refuse a modified copy
        run: |
          chmod +x signed/ostena
          tool="$RUNNER_TEMP/ostena"
          cp signed/ostena "$tool"
          key="$RUNNER_TEMP/release-test.key"
          "$tool" ca key new --key-out "$key" --public-out "$RUNNER_TEMP/release-test.pub"
          "$tool" release sign --key "$key" --out "$RUNNER_TEMP/ostena-release.manifest" signed/*
          rm -f "$key"
          mv "$RUNNER_TEMP/ostena-release.manifest" "$RUNNER_TEMP/ostena-release.manifest.sig" \
             "$RUNNER_TEMP/release-test.pub" signed/
          "$tool" release verify signed/ostena-release.manifest --key signed/release-test.pub
          cp -r signed "$RUNNER_TEMP/tampered"
          printf 'x' >> "$RUNNER_TEMP/tampered/ostena.exe"
          status=0
          "$tool" release verify "$RUNNER_TEMP/tampered/ostena-release.manifest" \
            --key signed/release-test.pub || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::a modified file must be refused with exit code 1, got $status"
            exit 1
          fi
          {
            echo "## Livrables signés (clé de test)"
            echo
            echo "Clé de test tirée pour cette exécution et détruite : elle ne prouve que"
            echo "l'intégrité de l'artefact \`ostena-test-signed\`, pas son origine (ADR-0017)."
            echo
            echo '```text'
            "$tool" release verify signed/ostena-release.manifest --key signed/release-test.pub
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ostena-test-signed
          path: signed/
          retention-days: 7

  # The M1 demonstration end to end (docs/demo-m1.md), on the signed Linux
  # release binary, whose signature is checked first: ostena login with
  # password and TOTP, ssh account@resource@bastion through the agent to a
  # real OpenSSH target in a network namespace, sealed transcript, offline
  # audit verification, then tampering found in a transcript, the export and
  # the database. Local processes only (PostgreSQL of the runner, sudo for
  # the namespace and the two system accounts of the core, service and
  # migrations, which the script creates).
  demo-m1:
    needs: [changes, release-sign]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ostena-test-signed
          path: signed
      - name: The binary is the one signed by release-sign
        run: |
          chmod +x signed/ostena
          signed/ostena release verify signed/ostena-release.manifest --key signed/release-test.pub
      - name: PostgreSQL 16, local connections by peer only; OpenSSH server
        run: |
          sudo systemctl start postgresql.service
          psql --version | grep -q ' 16\.'
          command -v sshd || test -x /usr/sbin/sshd \
            || (sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server)
          ssh -V
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      # The codes an authenticator would show: an example of ostena-crypto,
      # never in the release binary.
      - run: cargo build --locked -p ostena-crypto --example totp_code
      - run: bash lab/demo-m1.sh
        env:
          OSTENA_BIN: ${{ github.workspace }}/signed/ostena
          OSTENA_DEMO_DIR: ${{ runner.temp }}/demo-m1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-m1-logs
          path: |
            ${{ runner.temp }}/demo-m1/*.log
            ${{ runner.temp }}/demo-m1/target/sshd.log
          if-no-files-found: ignore
          retention-days: 14

  # The MSI on Windows Server 2016 in the lab (ADR-0024, ADR-0025): the gateway
  # gw2016 of the isolated zone installs the signed package silently and runs
  # the checks of install-windows, without a core (lab/agent-msi.sh). The lab
  # takes hours: weekly run and manual runs only, outside ci-ok.
  lab-agent:
    needs: [changes, release-sign]
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/lab.yml
    with:
      artifacts: ostena-test-signed
      command: bash lab/agent-msi.sh "$LAB_ARTIFACTS/ostena-test-signed" gw2016

  # The single required check of the branch protection: every job must have
  # succeeded, or been skipped by `changes` for a documentation-only change.
  ci-ok:
    if: always()
    needs:
      - changes
      - checks
      - linux
      - ssh-interop
      - core-db
      - release-linux
      - fuzz-smoke
      - windows
      - rdp-windows
      - bench-ssh
      - package
      - msi-sign
      - install-windows
      - install-debian
      - release-sign
      - demo-m1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "results: $RESULTS (code changed: $CODE)"
          for r in $RESULTS; do
            case "$r" in
              success) ;;
              skipped) [ "$CODE" = "false" ] || { echo "::error::a job was skipped"; exit 1; } ;;
              *) echo "::error::a job ended with $r"; exit 1 ;;
            esac
          done
