# Fuzzing crate, outside the main workspace: it needs a nightly toolchain
# (fuzz/rust-toolchain.toml) and libfuzzer-sys (NCSA license, never shipped).
# Run with `cargo xtask fuzz [seconds]`.
[package]
name = "ostena-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
ostena-audit = { path = "../crates/ostena-audit" }
ostena-common = { path = "../crates/ostena-common" }
ostena-crypto = { path = "../crates/ostena-crypto" }
ostena-frame = { path = "../crates/ostena-frame" }
ostena-grant = { path = "../crates/ostena-grant" }
ostena-recorder = { path = "../crates/ostena-recorder" }
ostena-scope = { path = "../crates/ostena-scope" }
ostena-ssh = { path = "../crates/ostena-ssh", default-features = false }
ostena-tunnel = { path = "../crates/ostena-tunnel" }

[[bin]]
name = "grant_decode"
path = "fuzz_targets/grant_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ssh_precheck"
path = "fuzz_targets/ssh_precheck.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ssh_certificate"
path = "fuzz_targets/ssh_certificate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ssh_login"
path = "fuzz_targets/ssh_login.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scope_target"
path = "fuzz_targets/scope_target.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scope_policy"
path = "fuzz_targets/scope_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "release_manifest"
path = "fuzz_targets/release_manifest.rs"
test = false
doc = false
bench = false

# Its own workspace, so the main one does not pull libfuzzer-sys.
[workspace]
members = ["."]

[profile.release]
debug = 1
[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
