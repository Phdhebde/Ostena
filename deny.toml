# cargo-deny configuration. Run with `cargo deny check`.
# Air-gapped environments: mirror the advisory database and run
# `cargo deny check --disable-fetch` (see CONTRIBUTING.md).

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    # wasm32-unknown-unknown is left out: the only wasm crate, ostena-frame,
    # has no dependency, and native crates would show their wasm-only
    # dependencies (quinn-proto pulls ring there). Add it back, scoped, with
    # ostena-web-client.
]

[advisories]
version = 2
yanked = "deny"
# Every ignored advisory needs an id, a reason and an owner.
ignore = [
    # Marvin attack (timing side channel on RSA private-key decryption and
    # signature) in rsa 0.10.0-rc.18, pulled in unconditionally by picky,
    # sspi and winscard (pinned by ADR-0019), no fixed version. The agent
    # performs no RSA private-key operation (licences encrypted with the
    # target public key, public-key verification only, no PKINIT or smart
    # card); guarded by the test no_rsa_private_key_in_ostena_rdp.
    # Maintainer decision approved by Max on 2026-11-26, review by 2027-03-31
    # (ADR-0019 section 9).
    { id = "RUSTSEC-2023-0071", reason = "no RSA private-key operation in the agent (ADR-0019 section 9); review by 2027-03-31" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# The allow list is the policy, not an inventory: unused entries are fine.
unused-allowed-license = "allow"
# The libfuzzer-sys exception only applies to the fuzz/ workspace.
unused-license-exception = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
]
exceptions = [
    # unicode-ident embeds Unicode character tables under the permissive
    # Unicode-3.0 license, on top of MIT OR Apache-2.0. It is a build-time
    # dependency of every procedural macro (serde_derive, thiserror) and is not
    # linked into the shipped binary. Scoped to this crate only.
    { crate = "unicode-ident", allow = ["Unicode-3.0"] },
    # Accepted 2026-11-15 (ADR-0011): stringprep, an unconditional dependency
    # of sqlx-postgres (SASLprep for SCRAM, never used with peer), pulls these
    # two Unicode tables, linked into the core binary on Linux. No sqlx
    # without them, short of a fork. Only through that path (bans below);
    # any other crate under Unicode-3.0 stays refused.
    { crate = "unicode-normalization", allow = ["Unicode-3.0"] },
    { crate = "unicode-properties", allow = ["Unicode-3.0"] },
    # libfuzzer-sys bundles LLVM libFuzzer (NCSA). Only used by the fuzz/ crate,
    # which has its own workspace and is never shipped. cargo-fuzz itself is a
    # tool (MIT OR Apache-2.0), not a dependency.
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[licenses.private]
# Workspace crates are AGPL-3.0-or-later (LICENSE) and not published. They are
# left out of the check so that AGPL stays off the allow list above: no
# dependency may bring a strong copyleft license (GPL, AGPL).
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# Duplicates that cannot be avoided go here, each with a reason.
skip = [
    # Build-time only (procedural macros): clap_derive and futures-macro use
    # syn 3, the derives of russh and of its dependencies still use syn 2.
    # Nothing of it is linked into the binary.
    { crate = "syn@2.0.119", reason = "proc-macro dependency of russh (delegate, enum_dispatch) and curve25519-dalek, build time only" },
    # sqlx 0.9 straddles two generations of its dependencies: sha2 0.10 in
    # sqlx-core (migration checksums) and 0.11 in sqlx-postgres (SCRAM), base64
    # 0.22, and hashlink on hashbrown 0.16. Linked into the core binary only.
    { crate = "sha2@0.10.9", reason = "sqlx-core (ADR-0011)" },
    { crate = "digest@0.10.7", reason = "sha2 0.10, through sqlx-core (ADR-0011)" },
    { crate = "block-buffer@0.10.4", reason = "sha2 0.10, through sqlx-core (ADR-0011)" },
    { crate = "crypto-common@0.1.6", reason = "sha2 0.10, through sqlx-core (ADR-0011)" },
    { crate = "generic-array@0.14.9", reason = "sha2 0.10, through sqlx-core (ADR-0011)" },
    { crate = "cpufeatures@0.2.17", reason = "sha2 0.10, through sqlx-core (ADR-0011)" },
    { crate = "base64@0.22.1", reason = "sqlx-core (ADR-0011)" },
    { crate = "hashbrown@0.16.1", reason = "hashlink, through sqlx-core (ADR-0011)" },
    # IronRDP (ironrdp-pdu, licences) and sspi straddle two generations of
    # RustCrypto: the older one is linked into the agent through ostena-rdp
    # only (ADR-0019).
    { crate = "hmac@0.12.1", reason = "ironrdp-pdu (ADR-0019)" },
    { crate = "md-5@0.10.6", reason = "ironrdp-pdu (ADR-0019)" },
    { crate = "pkcs1@0.7.5", reason = "ironrdp-pdu (ADR-0019)" },
    { crate = "der@0.7.10", reason = "pkcs1 0.7, through ironrdp-pdu (ADR-0019)" },
    { crate = "spki@0.7.3", reason = "pkcs1 0.7, through ironrdp-pdu (ADR-0019)" },
    { crate = "const-oid@0.9.6", reason = "der 0.7, through ironrdp-pdu (ADR-0019)" },
    { crate = "num-bigint@0.4.8", reason = "ironrdp-pdu (ADR-0019); russh uses 0.5" },
    { crate = "getrandom@0.3.4", reason = "sspi and rand_core 0.9 (ADR-0019)" },
    { crate = "rand@0.9.5", reason = "ironrdp-connector (ADR-0019)" },
    { crate = "rand_core@0.9.5", reason = "rand 0.9, through ironrdp-connector (ADR-0019)" },
]
skip-tree = []
deny = [
    # TLS and crypto go through rustls / aws-lc-rs in ostena-crypto only.
    { crate = "openssl", reason = "OpenSSL is forbidden, use ostena-crypto" },
    { crate = "openssl-sys", reason = "OpenSSL is forbidden, use ostena-crypto" },
    { crate = "native-tls", reason = "OpenSSL/SChannel bindings are forbidden, use ostena-crypto" },
    # Cryptography goes through ostena-crypto only (ADR-0009): aws-lc-rs,
    # rustls and rcgen may be direct dependencies of ostena-crypto, and of the
    # libraries ostena-crypto drives, nothing else. ring is refused everywhere.
    { crate = "aws-lc-rs", wrappers = ["ostena-crypto", "rustls", "rustls-webpki", "rcgen", "quinn-proto", "russh"], reason = "only ostena-crypto may call aws-lc-rs" },
    { crate = "aws-lc-sys", wrappers = ["aws-lc-rs"], reason = "only reachable through aws-lc-rs" },
    { crate = "rustls", wrappers = ["ostena-crypto", "quinn", "quinn-proto", "tokio-rustls"], reason = "TLS configurations are built by ostena-crypto::tls only; quinn and tokio-rustls only carry them" },
    # HTTPS of the login API (ADR-0015) and the TCP fallback of the tunnel.
    { crate = "tokio-rustls", wrappers = ["ostena-core", "ostena-cli", "ostena-tunnel"], reason = "HTTPS of the core API (ADR-0015) and the TCP fallback of the tunnel (ADR-0008)" },
    { crate = "hyper", wrappers = ["ostena-core", "ostena-cli", "hyper-util"], reason = "HTTP of the core API only (ADR-0015)" },
    # The database belongs to the core: the session manager and the protocol
    # crates are tested alone (ADR-0011, ADR-0018).
    { crate = "sqlx", wrappers = ["ostena-core"], reason = "PostgreSQL is the core's business only (ADR-0011, ADR-0018)" },
    # QUIC is the tunnel's business only (ADR-0008).
    { crate = "quinn", wrappers = ["ostena-tunnel"], reason = "QUIC is used by ostena-tunnel only" },
    { crate = "quinn-proto", wrappers = ["quinn"], reason = "only reachable through quinn" },
    { crate = "rustls-webpki", wrappers = ["rustls", "ostena-crypto"], reason = "certificate verification only through rustls, and in ostena-crypto::tsp for the time-stamping certificates" },
    { crate = "rcgen", wrappers = ["ostena-crypto"], reason = "certificates are issued by ostena-crypto::pki only" },
    { crate = "vsss-rs", wrappers = ["ostena-crypto"], reason = "secret sharing of the root secret by ostena-crypto::sealed only" },
    { crate = "ring", reason = "use ostena-crypto (aws-lc-rs)" },
    # The SSH library brings its own cryptography: an exception confined to
    # ostena-ssh (ADR-0009, section écarts). Each crate below is reachable only
    # through russh, ssh-key and their own internal chain, never from our code.
    { crate = "russh", wrappers = ["ostena-ssh"], reason = "SSH is ostena-ssh business only (ADR-0010)" },
    { crate = "ssh-key", wrappers = ["ostena-ssh", "russh"], reason = "SSH keys only through ostena-ssh and russh" },
    { crate = "ssh-cipher", wrappers = ["ssh-key"], reason = "russh exception (ADR-0009)" },
    { crate = "p256", wrappers = ["picky", "russh", "ssh-key"], reason = "russh exception (ADR-0009); P-256 goes through ostena-crypto; RDP exception (ADR-0009)" },
    { crate = "p384", wrappers = ["picky", "russh", "ssh-key"], reason = "russh exception (ADR-0009); RDP exception (ADR-0009)" },
    { crate = "p521", wrappers = ["picky", "russh", "ssh-key"], reason = "russh exception (ADR-0009); RDP exception (ADR-0009)" },
    { crate = "ecdsa", wrappers = ["p256", "p384", "p521", "russh"], reason = "russh exception (ADR-0009); ECDSA goes through ostena-crypto" },
    { crate = "elliptic-curve", wrappers = ["ecdsa", "p256", "p384", "p521", "primeorder", "russh"], reason = "russh exception (ADR-0009)" },
    { crate = "ed25519-dalek", wrappers = ["picky", "russh", "ssh-key"], reason = "russh exception (ADR-0009); Ed25519 is outside the frozen list; RDP exception (ADR-0009)" },
    { crate = "curve25519-dalek", wrappers = ["ed25519-dalek", "russh", "x25519-dalek"], reason = "russh exception (ADR-0009); X25519 is outside the frozen list; RDP exception (ADR-0009)" },
    { crate = "aes", wrappers = ["aes-gcm", "aes-kw", "picky", "picky-krb", "pkcs5", "russh", "ssh-cipher"], reason = "russh exception (ADR-0009); AES goes through ostena-crypto; RDP exception (ADR-0009)" },
    { crate = "aes-gcm", wrappers = ["picky", "pkcs5", "ssh-cipher"], reason = "russh exception (ADR-0009); RDP exception (ADR-0009)" },
    { crate = "ctr", wrappers = ["aes-gcm", "picky", "russh"], reason = "russh exception (ADR-0009); RDP exception (ADR-0009)" },
    { crate = "cbc", wrappers = ["picky", "picky-krb", "pkcs5", "russh"], reason = "russh exception (ADR-0009); RDP exception (ADR-0009)" },
    { crate = "ghash", wrappers = ["aes-gcm", "russh"], reason = "russh exception (ADR-0009)" },
    { crate = "polyval", wrappers = ["ghash", "russh"], reason = "russh exception (ADR-0009)" },
    { crate = "poly1305", wrappers = ["ssh-cipher"], reason = "russh exception (ADR-0009)" },
    { crate = "salsa20", wrappers = ["russh", "scrypt"], reason = "russh exception (ADR-0009)" },
    { crate = "sha1", wrappers = ["ironrdp-pdu", "picky", "picky-krb", "russh", "ssh-key", "sspi", "winscard"], reason = "russh exception (ADR-0009); RDP exception (ADR-0009)" },
    { crate = "sha2", wrappers = ["bcrypt-pbkdf", "ed25519-dalek", "p256", "p384", "p521", "pageant", "picky", "pkcs5", "russh", "scrypt", "sqlx-core", "sqlx-macros-core", "sqlx-postgres", "ssh-key", "sspi"], reason = "russh and sqlx-postgres exceptions (ADR-0009); SHA-2 goes through ostena-crypto; RDP exception (ADR-0009)" },
    { crate = "sha3", wrappers = ["ml-kem", "picky", "russh"], reason = "russh exception (ADR-0009); RDP exception (ADR-0009)" },
    { crate = "hmac", wrappers = ["hkdf", "ironrdp-pdu", "pbkdf2", "picky", "picky-krb", "rfc6979", "russh", "sqlx-postgres", "ssh-key", "sspi"], reason = "russh and sqlx-postgres exceptions (ADR-0009); HMAC goes through ostena-crypto; RDP exception (ADR-0009)" },
    { crate = "hkdf", wrappers = ["elliptic-curve", "sqlx-postgres"], reason = "russh and sqlx-postgres exceptions (ADR-0009)" },
    { crate = "md5", wrappers = ["russh"], reason = "russh exception (ADR-0009)" },
    { crate = "md-5", wrappers = ["ironrdp-pdu", "picky", "sqlx-postgres", "sspi"], reason = "sqlx-postgres exception (ADR-0009): MD5 password authentication, never used (peer only, CORE-E003); RDP exception (ADR-0009)" },
    { crate = "ml-kem", wrappers = ["russh"], reason = "russh exception (ADR-0009); ML-KEM goes through ostena-crypto" },
    { crate = "pbkdf2", wrappers = ["bcrypt-pbkdf", "picky", "picky-krb", "pkcs5", "russh", "scrypt"], reason = "russh exception (ADR-0009); PBKDF2 goes through ostena-crypto; RDP exception (ADR-0009)" },
    { crate = "scrypt", wrappers = ["pkcs5", "russh"], reason = "russh exception (ADR-0009)" },
    { crate = "argon2", wrappers = ["ssh-key"], reason = "russh exception (ADR-0009)" },
    { crate = "bcrypt-pbkdf", wrappers = ["ssh-key"], reason = "russh exception (ADR-0009)" },
    { crate = "blowfish", wrappers = ["bcrypt-pbkdf"], reason = "russh exception (ADR-0009)" },
    # DES and 3DES Kerberos types: never requested by sspi (AES256 then AES128
    # only, RDP-E006), admitted under picky and picky-krb only (ADR-0009).
    { crate = "des", wrappers = ["picky", "picky-krb"], reason = "outside the frozen list; RDP exception (ADR-0009): Kerberos types never requested" },
    { crate = "rand", wrappers = ["ironrdp-acceptor", "ironrdp-connector", "num-bigint", "pageant", "picky", "picky-krb", "proptest", "quinn-proto", "russh", "sqlx-postgres", "sspi"], reason = "randomness goes through ostena-crypto::rand; russh, quinn-proto and sqlx-postgres (SCRAM nonce) draw their own, proptest is test only; RDP exception (ADR-0009)" },
    # RDP is the business of ostena-rdp only (ADR-0019). IronRDP and sspi bring
    # their own cryptography: an exception confined to ostena-rdp (ADR-0009,
    # section RDP). Each crate below is reachable only through that chain.
    { crate = "ironrdp-connector", wrappers = ["ironrdp-acceptor", "ironrdp-async", "ostena-rdp"], reason = "RDP is ostena-rdp business only (ADR-0019)" },
    { crate = "ironrdp-pdu", wrappers = ["ironrdp-acceptor", "ironrdp-async", "ironrdp-connector", "ironrdp-svc", "ostena-rdp"], reason = "RDP is ostena-rdp business only (ADR-0019)" },
    { crate = "ironrdp-core", wrappers = ["ironrdp-acceptor", "ironrdp-async", "ironrdp-connector", "ironrdp-pdu", "ironrdp-svc", "ostena-rdp"], reason = "RDP is ostena-rdp business only (ADR-0019)" },
    { crate = "ironrdp-svc", wrappers = ["ironrdp-acceptor", "ironrdp-connector", "ostena-rdp"], reason = "RDP is ostena-rdp business only (ADR-0019)" },
    { crate = "ironrdp-error", wrappers = ["ironrdp-connector", "ironrdp-core", "ironrdp-pdu"], reason = "only reachable through IronRDP" },
    { crate = "ironrdp-acceptor", wrappers = ["ostena-rdp"], reason = "server side of the sequence: tests of ostena-rdp only" },
    { crate = "ironrdp-async", wrappers = ["ironrdp-acceptor"], reason = "tests of ostena-rdp only, through ironrdp-acceptor" },
    { crate = "sspi", wrappers = ["ironrdp-connector", "ostena-rdp"], reason = "CredSSP is ostena-rdp business only (ADR-0019); RDP exception (ADR-0009)" },
    { crate = "picky", wrappers = ["ironrdp-connector", "sspi", "winscard"], reason = "RDP exception (ADR-0009): X.509 and keys of IronRDP and sspi only" },
    { crate = "picky-krb", wrappers = ["sspi"], reason = "RDP exception (ADR-0009): Kerberos of sspi only" },
    { crate = "md4", wrappers = ["sspi"], reason = "RDP exception (ADR-0009): NTLM, Restricted Admin only" },
    { crate = "rc2", wrappers = ["picky"], reason = "RDP exception (ADR-0009): present, never called" },
    { crate = "aes-kw", wrappers = ["picky"], reason = "RDP exception (ADR-0009): present, never called" },
    { crate = "x25519-dalek", wrappers = ["picky"], reason = "RDP exception (ADR-0009): present, never called" },
    { crate = "rsa", wrappers = ["picky", "sspi", "winscard"], reason = "RDP exception (ADR-0009): present, never called by Ostena" },
    { crate = "crypto-mac", wrappers = ["sspi"], reason = "RDP exception (ADR-0009)" },
    { crate = "num-bigint", wrappers = ["ironrdp-pdu", "russh"], reason = "raw RSA of the RDS licences (ironrdp-pdu) and russh only (ADR-0009)" },
    # The smart card emulation of sspi, forced by ironrdp-connector (feature
    # scard, upstream note in docs/notes/): linked, never reached (Ostena never
    # builds a smart card identity). Native code (zlib in C) and a PKCS#11
    # loader (dlopen): nothing else may pull them.
    { crate = "winscard", wrappers = ["sspi"], reason = "smart card of sspi, forced by ironrdp-connector, never used (ADR-0019)" },
    { crate = "cryptoki", wrappers = ["sspi"], reason = "PKCS#11 of sspi (scard), never used (ADR-0019)" },
    { crate = "cryptoki-sys", wrappers = ["cryptoki"], reason = "PKCS#11 of sspi (scard), never used (ADR-0019)" },
    { crate = "libloading", wrappers = ["cryptoki", "cryptoki-sys"], reason = "PKCS#11 loader of sspi (scard), never used (ADR-0019)" },
    { crate = "flate2", wrappers = ["winscard"], reason = "smart card of sspi (scard), never used (ADR-0019)" },
    { crate = "libz-sys", wrappers = ["flate2"], reason = "native zlib of the smart card of sspi, never used (ADR-0019)" },
    # PostgreSQL is the business of ostena-core only (ADR-0011). Its own
    # cryptography (SCRAM and MD5 authentication) is an exception confined to
    # sqlx-postgres (ADR-0009, above); production authenticates by peer only.
    { crate = "sqlx", wrappers = ["ostena-core"], reason = "PostgreSQL is ostena-core business only (ADR-0011)" },
    { crate = "sqlx-core", wrappers = ["sqlx", "sqlx-macros", "sqlx-macros-core", "sqlx-postgres"], reason = "only reachable through sqlx" },
    { crate = "sqlx-postgres", wrappers = ["sqlx", "sqlx-macros-core"], reason = "only reachable through sqlx" },
    { crate = "stringprep", wrappers = ["sqlx-postgres"], reason = "Unicode-3.0 exception, only through sqlx-postgres (ADR-0011)" },
    { crate = "unicode-normalization", wrappers = ["stringprep"], reason = "Unicode-3.0 exception, only through stringprep (ADR-0011)" },
    { crate = "unicode-properties", wrappers = ["stringprep"], reason = "Unicode-3.0 exception, only through stringprep (ADR-0011)" },
    # The TLS of sqlx adds the public roots to the configured CA: it is not
    # built (tls-none), and the public root bundle is refused everywhere.
    { crate = "webpki-roots", reason = "public root bundle: never trusted (ADR-0011)" },
    { crate = "rustls-native-certs", reason = "system roots: never trusted (ADR-0011)" },
    # Unicode tables of url (idna): idna_adapter is pinned to its ASCII-only
    # release, so none of them is linked (Unicode-3.0, ADR-0011).
    { crate = "icu_normalizer", reason = "IDNA tables refused: idna_adapter is pinned to 1.0.0 (ADR-0011)" },
    { crate = "icu_properties", reason = "IDNA tables refused: idna_adapter is pinned to 1.0.0 (ADR-0011)" },
    { crate = "icu_collections", reason = "IDNA tables refused: idna_adapter is pinned to 1.0.0 (ADR-0011)" },
    { crate = "icu_provider", reason = "IDNA tables refused: idna_adapter is pinned to 1.0.0 (ADR-0011)" },
    { crate = "icu_locale_core", reason = "IDNA tables refused: idna_adapter is pinned to 1.0.0 (ADR-0011)" },
]

[sources]
unknown-registry = "deny"
# Git dependencies are refused unless explicitly listed here; any entry must be
# pinned with `rev = "<full commit hash>"` in Cargo.toml.
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
