allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true

# Protocol and standard names that are not code identifiers.
doc-valid-idents = ["TSRequest", "CycloneDX", "RustSec", "NetBIOS", "LLMNR", "NAT64", "IPv4", "IPv6", "HelloAck", "WebSocket", "WebAssembly", "CredSSP", "ChaCha20", "IronRDP", "DRDYNVC", "NTLMv2", ".."]

# Reading a secret must be visible in review: every call needs
# `#[expect(clippy::disallowed_methods)]` under a `// SECRET-EXPOSURE: <reason>`
# comment (checked by `cargo xtask check-secrets`).
disallowed-methods = [
  { path = "ostena_common::secret::Secret::expose_secret", reason = "secret exposure must be justified: add `// SECRET-EXPOSURE: <reason>` and `#[expect(clippy::disallowed_methods)]`" },
  { path = "ostena_common::secret::Secret::expose_secret_mut", reason = "secret exposure must be justified: add `// SECRET-EXPOSURE: <reason>` and `#[expect(clippy::disallowed_methods)]`" },
]
