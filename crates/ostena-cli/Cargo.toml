[package]
name = "ostena-cli"
description = "Entry point of the single `ostena` binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "ostena"
path = "src/main.rs"

[features]
# The native SSH server of the agent (ADR-0010). Always on in a release
# binary (`cargo xtask check-release` refuses one without it); turned off
# only by `cargo xtask footprint`, to measure an agent without SSH.
default = ["ssh"]
ssh = ["ostena-ssh/russh"]

[dependencies]
base64.workspace = true
clap.workspace = true
# `ostena login` (ADR-0015): one HTTP/1.1 request per connection, no pool.
http-body-util.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
ostena-audit.workspace = true
ostena-common.workspace = true
ostena-crypto.workspace = true
ostena-grant.workspace = true
ostena-platform.workspace = true
ostena-scope.workspace = true
# Keys and certificates of `ostena login` without the SSH library, which
# only the feature `ssh` (the SSH server of the agent) links.
ostena-ssh = { path = "../ostena-ssh", default-features = false }
ostena-tunnel.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
# `config.toml` of `ostena login`; the scope policy of a gateway group
# (`ostena core group policy`), written in TOML as in the agent configuration.
toml.workspace = true
tracing.workspace = true
zeroize.workspace = true

# The core is a Linux component by design (ADR-0011): the Windows binary,
# which only runs the agent, does not link it nor PostgreSQL.
[target.'cfg(target_os = "linux")'.dependencies]
ostena-core.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The demonstration test creates its own database.
ostena-core = { workspace = true, features = ["testing"] }
# The login tests run the core listener with a test PKI.
ostena-crypto = { workspace = true, features = ["testing"] }

[dev-dependencies]
# The enrolment tests run the binary against the in-process test core.
ostena-tunnel = { workspace = true, features = ["testing"] }

[[test]]
name = "agent_ssh"
required-features = ["ssh"]

[lints]
workspace = true
