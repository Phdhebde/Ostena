[package]
name = "ostena-crypto"
description = "The only crate allowed to call cryptographic primitives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[features]
# Deliberately non-compliant TLS peers for refusal tests. Never in a release
# binary (`cargo xtask check-release`).
testing = []

[dependencies]
aws-lc-rs.workspace = true
base64.workspace = true
ostena-common.workspace = true
rcgen.workspace = true
# tls12: only for the RDP target profile (tls::target, ADR-0009 « écart RDP »)
# and the directories that admit it (tls::directory, « Annuaires LDAPS »);
# every other configuration pins TLS 1.3.
rustls = { workspace = true, features = ["tls12"] }
# Chain of a time-stamping certificate (RFC 3161): the verifier of rustls,
# with an extended key usage of our own (tsp).
rustls-webpki.workspace = true
thiserror.workspace = true
time.workspace = true
vsss-rs.workspace = true
rand_core.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
