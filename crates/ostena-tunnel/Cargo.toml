[package]
name = "ostena-tunnel"
description = "Dial-back mTLS tunnel between the gateway agent and the core: QUIC, control messages, prioritised session channels."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[features]
# In-process test core and foreign TLS peers. Never in a release binary:
# `cargo xtask check-release` fails if it is enabled for ostena-cli.
testing = ["ostena-crypto/testing"]

[dependencies]
base64.workspace = true
ostena-common.workspace = true
ostena-crypto.workspace = true
ostena-grant.workspace = true
ostena-scope.workspace = true
quinn.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# macros: select! in the transcript pump (already enabled through russh in
# the agent binary).
tokio = { workspace = true, features = ["macros"] }
# TLS 1.3 over TCP, the fallback of QUIC (ADR-0008): carries the
# configuration of ostena-crypto::tls, already in the agent and the core
# binaries for the login API (ADR-0015).
tokio-rustls.workspace = true
tracing.workspace = true

[dev-dependencies]
ostena-grant.workspace = true
ostena-scope.workspace = true
ostena-platform.workspace = true
# Paused time for the tests that depend on it (no tolerance margins).
tokio = { workspace = true, features = ["test-util"] }
# The integration tests and the benchmark run against the test core.
ostena-tunnel = { path = ".", features = ["testing"] }
proptest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "latency"
harness = false

[[example]]
name = "test_core"
required-features = ["testing"]

[lints]
workspace = true
