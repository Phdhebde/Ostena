[package]
name = "ostena-core"
description = "The core: agent registry, enrolment and tunnel listener, PostgreSQL store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Test databases. Never in a release binary: `cargo xtask check-release`
# fails if it is enabled for ostena-cli.
testing = []

[dependencies]
idna_adapter.workspace = true
ostena-common.workspace = true
ostena-crypto.workspace = true
ostena-tunnel.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
ostena-core = { path = ".", features = ["testing"] }

[lints]
workspace = true
