[package]
name = "ostena-ssh"
description = "Native SSH access: frozen algorithms, pre-check of the peer, SSH library configuration (ADR-0010)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
ostena-common.workspace = true
# Generates the SSH keys (ADR-0010); also brings aws-lc-rs with
# prebuilt-nasm (offline Windows build, ADR-0002) when built alone.
ostena-crypto.workspace = true
russh = { workspace = true, optional = true }
ssh-key = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
# The SSH library and its configuration. Off for the fuzz workspace: the
# pre-check depends on nothing of it, and russh does not build with the
# pinned fuzzing nightly.
default = ["russh"]
russh = ["dep:russh", "dep:ssh-key"]

[dev-dependencies]
proptest.workspace = true
tracing-subscriber.workspace = true

[[test]]
name = "interop"
required-features = ["russh"]

[[test]]
name = "target"
required-features = ["russh"]

[[test]]
name = "keys"
required-features = ["russh"]

[[example]]
name = "footprint_server"
required-features = ["russh"]

[lints]
workspace = true
