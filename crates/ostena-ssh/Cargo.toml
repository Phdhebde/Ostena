[package]
name = "ostena-ssh"
description = "Native SSH access: frozen algorithms, pre-check of the peer, certificates, agent server and driver to the targets (ADR-0010)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
ostena-common.workspace = true
# Generates the SSH keys (ADR-0010); also brings aws-lc-rs with
# prebuilt-nasm (offline Windows build, ADR-0002) when built alone.
ostena-crypto.workspace = true
# Kid of a certificate authority, computed as for the grant keys.
ostena-grant.workspace = true
# PinnedTarget: the driver dials nothing else (anti-SSRF by type).
ostena-scope = { workspace = true, optional = true }
russh = { workspace = true, optional = true }
ssh-key = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
# The SSH library and its configuration. Off for the fuzz workspace: the
# pre-check depends on nothing of it, and russh does not build with the
# pinned fuzzing nightly.
default = ["russh"]
# tokio/macros (select!) is already enabled by russh-util, a dependency of
# russh: declared here rather than relied upon.
russh = ["dep:russh", "dep:ssh-key", "dep:ostena-scope", "tokio/macros"]

[dev-dependencies]
# The gateway tests and the end-to-end example run against the in-process
# test core: never in a release binary (dev-dependency only).
ostena-tunnel = { workspace = true, features = ["testing"] }
proptest.workspace = true
tracing-subscriber.workspace = true

[[test]]
name = "interop"
required-features = ["russh"]

[[test]]
name = "target"
required-features = ["russh"]

[[test]]
name = "keys"
required-features = ["russh"]

[[test]]
name = "certificates"
required-features = ["russh"]

[[test]]
name = "gateway"
required-features = ["russh"]

[[example]]
name = "footprint_server"
required-features = ["russh"]

[lints]
workspace = true
